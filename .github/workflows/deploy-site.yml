name: Deploy site

# Deploys site/ to Cloudflare Pages (project "rechenbox", served at https://rechenbox.ch).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (account token "rechenbox-github-deploy": Pages Write, D1 Write) and CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.168.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the secrets are set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID first."
            exit 1
          fi

      - name: Check JavaScript syntax
        run: |
          for f in public/assets/*.js functions/api/*.js lib/*.js; do node --check "$f"; done

      - name: Apply database schema (idempotent)
        run: npx --yes "wrangler@${WRANGLER_VERSION}" d1 execute rechenbox --remote --file=schema.sql --yes

      - name: Deploy to Cloudflare Pages
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy \
            --project-name rechenbox \
            --branch main \
            --commit-hash "${GITHUB_SHA}" \
            --commit-message "$(git log -1 --pretty=%s | head -c 300)"

      - name: Smoke test
        run: |
          url="https://rechenbox.pages.dev"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url/") && [ "$code" = "200" ] && break
            sleep 10
          done
          echo "Home page: $code"
          [ "$code" = "200" ]
          signup=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "$url/api/signup")
          echo "Sign-up API with an empty form: $signup (expected 422)"
          [ "$signup" = "422" ]
